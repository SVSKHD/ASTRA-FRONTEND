<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0e2e" />
    <meta
      name="description"
      content="Aureon — your universe, tracked. Todos, tasks, deadlines, reminders and finances in one liquid-glass, space-themed app."
    />
    <!-- No-flash theme boot: apply the last-used theme's data-theme + surface
         colour synchronously, before the app bundle loads, so a reload never
         flashes an unthemed or wrong-theme frame. The app reconciles from
         Firestore after auth. -->
    <script>
      try {
        var id = localStorage.getItem('aureon:themeId')
        var bg = localStorage.getItem('aureon:themeBg')
        if (id) document.documentElement.dataset.theme = id
        if (bg) {
          document.documentElement.style.background = bg
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', bg)
        }
      } catch (e) {}
    </script>
    <title>Aureon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      The webfont is loaded without blocking the first paint. As a plain
      stylesheet this is a third-party request on the critical path — a DNS
      lookup, a TLS handshake and a round trip to a host we do not control,
      all before anything renders. Switching the media type after load lets the
      browser fetch it at low priority instead; `display=swap` in the URL means
      text paints in the fallback immediately and swaps when the font lands.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
