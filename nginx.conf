# The SPA, served the way production serves it (Aureon_agents_Assembler
# deploy/nginx/spasta-online.conf and security-headers.conf).
#
# This container serves the built frontend only. The app calls the Aureon API on
# the SAME origin (/api/*, SameSite=Strict session cookies), so whatever sits in
# front of this container must route /api/ to Aureon. On its own, /api/ answers
# 404 here rather than falling through to index.html.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Hashed build output: cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The service worker, its registration, the manifest, the shell and the build
    # stamp must never be cached, or a new release never reaches the browser.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html|version\.json)$ {
        expires -1;
        try_files $uri =404;
    }

    # The API is not served by this container (see the note above).
    location /api/ {
        return 404;
    }

    # Client-side routes fall back to the app shell.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
